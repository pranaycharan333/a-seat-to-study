const SPACES = RAW_SPACES.map((row, idx) => {
  const [id, bld, floor, name, type, audience, total, free, noise, facilities, desc] = row;
  const zone = String.fromCharCode(65 + (idx % 12));
  const chairs = Array.from({ length: total }, (_, i) => {
    const hash = (i * 7 + idx * 5) % total;
    let status = hash < free ? 'vacant' : 'booked';
    if (status === 'booked' && i % 7 === 0) status = 'expiring';
    const num = String(i + 1).padStart(2, '0');
    return { id: `${id}-c${i + 1}`, code: `${zone}-${num}`, status };
  });
  return { id, bld, floor, name, type, audience, total, noise, facilities, desc, chairs };
});

const countVacant = (sp) => sp.chairs.filter(c => c.status === 'vacant').length;
const countBooked = (sp) => sp.chairs.filter(c => c.status !== 'vacant').length;
const sumBy = (arr, fn) => arr.reduce((acc, item) => acc + fn(item), 0);

function spaceMatchesPreference(sp) {
  if (STATE.mode === 'solo') {
    if (sp.type !== 'solo') return false;
    return STATE.noise === 'Any' || sp.noise === STATE.noise;
  }
  return sp.type === 'group' && countVacant(sp) >= Math.min(STATE.groupSize, sp.total);
}

function getBookFine(book) {
  if (book.finePaid || book.dueOffset >= 0) return 0;
  return Math.abs(book.dueOffset) * 5;
}

function getBookStatus(book) {
  if (book.dueOffset < 0 && !book.finePaid) return { label: 'Overdue', key: 'overdue', cls: 'bg-rose-50 text-rose-700 border-rose-200' };
  if (book.dueOffset < 0 && book.finePaid) return { label: 'Fine Paid', key: 'paid', cls: 'bg-tealbrand-50 text-tealbrand-700 border-tealbrand-200' };
  if (book.dueOffset <= 3) return { label: 'Due Soon', key: 'soon', cls: 'bg-amber-50 text-amber-700 border-amber-200' };
  return { label: 'On Time', key: 'ok', cls: 'bg-emerald-50 text-emerald-700 border-emerald-200' };
}

function getAllReminders() {
  const auto = [];
  STATE.books.forEach(b => {
    const fine = getBookFine(b);
    if (b.dueOffset < 0 && !b.finePaid) {
      const id = `auto-ov-${b.id}`;
      if (!STATE.dismissedAutoIds.includes(id)) {
        auto.push({ id, auto: true, urgent: 'overdue', category: 'Fine Payment', title: `${b.title} is overdue by ${Math.abs(b.dueOffset)} days (Fine ₹${fine})`, when: `Due ${fmtShortDate(addDays(b.dueOffset))}` });
      }
    } else if (b.dueOffset >= 0 && b.dueOffset <= 3) {
      const id = `auto-soon-${b.id}`;
      if (!STATE.dismissedAutoIds.includes(id)) {
        auto.push({ id, auto: true, urgent: 'soon', category: 'Book Due', title: `${b.title} is due in ${b.dueOffset === 0 ? 'today' : b.dueOffset + ' days'}`, when: `Due ${fmtShortDate(addDays(b.dueOffset))}` });
      }
    }
  });
  STATE.bookings.forEach(bk => {
    const id = `auto-bk-${bk.bookingId}`;
    if (!STATE.dismissedAutoIds.includes(id)) {
      auto.push({ id, auto: true, urgent: 'booking', category: 'Study Session', title: `Seat ${bk.chairCode} reserved at ${bk.spaceName} (${bk.buildingName}, F${bk.floor})`, when: bk.slot });
    }
  });
  const custom = STATE.customReminders.filter(r => !r.done).map(r => ({ ...r, auto: false, urgent: 'custom' }));
  return [...auto, ...custom];
}

function getUrgentBadgeCount() {
  const overdueBooks = STATE.books.filter(b => b.dueOffset < 0 && !b.finePaid).length;
  const dueSoonBooks = STATE.books.filter(b => b.dueOffset >= 0 && b.dueOffset <= 3).length;
  return overdueBooks + dueSoonBooks;
}

function showToast(title, subtitle = '', tone = 'teal') {
  const container = document.getElementById('toast-container');
  const styles = {
    teal: 'border-tealbrand-500 bg-white/95 text-navy-800',
    green: 'border-emerald-500 bg-emerald-50/95 text-emerald-950',
    amber: 'border-amber-500 bg-amber-50/95 text-amber-950',
    rose: 'border-rose-500 bg-rose-50/95 text-rose-950'
  };
  const el = document.createElement('div');
  el.className = `pointer-events-auto border-l-4 rounded-xl px-4 py-3 shadow-xl backdrop-blur-md view-enter ${styles[tone] || styles.teal}`;
  el.innerHTML = `<div class="text-sm font-bold leading-snug">${title}</div>${subtitle ? `<div class="text-xs opacity-85 mt-0.5">${subtitle}</div>` : ''}`;
  container.appendChild(el);
  setTimeout(() => {
    el.style.opacity = '0';
    el.style.transform = 'translateY(-8px)';
    setTimeout(() => el.remove(), 260);
  }, 3400);
}

              <span class="w-12 h-12 rounded-2xl bg-tealbrand-50 text-2xl flex items-center justify-center">👥</span>
              <span class="px-3 py-1 rounded-full text-[11px] font-bold ${STATE.mode === 'group' ? 'btn-navy' : 'bg-slate-100 text-slate-500'}">${STATE.mode === 'group' ? 'Selected' : 'Choose'}</span>
            </div>
            <h2 class="font-display font-bold text-lg text-navy-800">Group Study</h2>
            <p class="text-xs text-slate-500 mt-1">Glass discussion rooms, whiteboard zones, and capstone team pods.</p>
          </button>
        </div>

        <div class="glass-card p-6 mb-6">
          ${STATE.mode === 'solo' ? `
            <div class="text-xs font-bold uppercase tracking-wider text-slate-500 mb-3">Preferred Noise Level</div>
            <div class="flex flex-wrap gap-2.5">
              ${['Any', 'Silent', 'Quiet'].map(n => `
                <button data-act="set-noise" data-val="${n}" class="px-5 py-2.5 rounded-full text-xs font-bold btn-chip ${STATE.noise === n ? 'active' : ''}">${n}</button>
              `).join('')}
            </div>
          ` : `
            <div class="text-xs font-bold uppercase tracking-wider text-slate-500 mb-3">Group Size</div>
            <div class="flex flex-wrap gap-2.5">
              ${[2, 4, 6, 8].map(sz => `
                <button data-act="set-size" data-val="${sz}" class="px-5 py-2.5 rounded-full text-xs font-bold btn-chip ${STATE.groupSize === sz ? 'active' : ''}">${sz} People</button>
              `).join('')}
            </div>
          `}
          ${STATE.role === 'faculty' ? `<div class="mt-4 p-3 rounded-xl bg-amber-50 border border-amber-200 text-xs text-amber-900 font-medium">✨ Faculty Mode Active: Dedicated <strong>Faculty Research Carrels</strong> and <strong>Seminar Suites</strong> are unlocked in the floor maps.</div>` : ''}
        </div>

        <div class="flex flex-wrap items-center justify-between gap-3">
          <button data-go="home" class="px-5 py-2.5 rounded-xl btn-soft text-xs sm:text-sm font-bold">← Back to Home</button>
          <button data-go="location" class="px-7 py-3 rounded-xl btn-navy text-xs sm:text-sm font-bold">Select Building & Floor →</button>
        </div>
      </div>
    `;
  },

  location() {
    return `
      <div class="view-enter">
        ${renderStepper(3)}
        ${demoNoticeBar(`<button data-act="refresh-demo" class="px-3 py-1 rounded-lg btn-soft text-[11px] font-bold">↻ Simulate Live Refresh</button>`)}
        <div class="mb-6">
          <span class="text-xs font-bold uppercase tracking-wider text-tealbrand-600">Step 3 of 6 • ${STATE.mode === 'solo' ? 'Solo (' + STATE.noise + ')' : 'Group of ' + STATE.groupSize}</span>
          <h1 class="font-display text-2xl sm:text-3xl font-extrabold text-navy-800 mt-1">Select an LPU Building & Enter a Floor</h1>
          <p class="text-sm text-slate-500 mt-1">Click any floor in the architectural elevation below to smoothly enter that floor's live chair matrix.</p>
        </div>

        <div class="grid md:grid-cols-2 gap-6 mb-6">
          ${BUILDINGS.map(b => {
            const bSpaces = accessibleSpaces(SPACES.filter(s => s.bld === b.id));
            const total = sumBy(bSpaces, s => s.total);
            const vacant = sumBy(bSpaces, countVacant);
            const booked = total - vacant;
            return `
              <div class="glass-card p-5 flex flex-col">
                <div class="flex items-start justify-between gap-3 mb-3">
                  <div>
                    <span class="text-[11px] font-extrabold uppercase tracking-wider text-tealbrand-600">${b.block} • ${b.hours}</span>
                    <h2 class="font-display text-lg font-extrabold text-navy-800 mt-0.5">${b.name}</h2>
                    <p class="text-xs text-slate-500 mt-0.5">${b.desc}</p>
                  </div>
                  <div class="text-right shrink-0">
                    <div class="px-2.5 py-1 rounded-full bg-emerald-50 text-emerald-700 border border-emerald-200 text-xs font-extrabold">${vacant} Vacant</div>
                    <div class="text-[11px] text-rose-600 font-semibold mt-1">${booked} Booked</div>
                  </div>
                </div>

                <div class="bg-slate-50/90 border border-slate-200 rounded-2xl p-3.5 mt-auto">
                  <div class="h-2.5 w-11/12 mx-auto rounded-t-xl bg-navy-800 mb-2"></div>
                  <div class="space-y-2">
                    ${[...b.floors].reverse().map(fl => {
                      const flSp = bSpaces.filter(s => s.floor === fl);
                      const flVac = sumBy(flSp, countVacant);
                      const flTot = sumBy(flSp, s => s.total);
                      const matchCount = flSp.filter(spaceMatchesPreference).length;
                      return `
                        <button data-act="enter-floor" data-bld="${b.id}" data-fl="${fl}" class="floor-btn w-full p-3 rounded-xl bg-white border border-slate-200 flex items-center justify-between gap-3 text-left">
                          <div class="flex items-center gap-3 min-w-0">
                            <span class="w-9 h-9 rounded-lg btn-navy text-xs font-extrabold flex items-center justify-center shrink-0">F${fl}</span>
                            <div class="min-w-0">
                              <div class="font-bold text-xs sm:text-sm text-navy-800 truncate">Floor ${fl} ${matchCount > 0 ? `<span class="ml-1 text-[10px] px-1.5 py-0.5 rounded bg-tealbrand-100 text-tealbrand-700">${matchCount} match</span>` : ''}</div>
                              <div class="text-[11px] text-slate-500 truncate">${flSp.map(s => s.name).join(' • ')}</div>
                            </div>
                          </div>
                          <div class="text-right shrink-0">
                            <div class="text-xs font-extrabold ${flVac > 5 ? 'text-emerald-600' : 'text-amber-600'}">${flVac}/${flTot} free</div>
                            <div class="text-[10px] font-bold text-tealbrand-700">Enter Floor →</div>
                          </div>
                        </button>
                      `;
                    }).join('')}
                  </div>
                  <div class="mt-2.5 pt-2 border-t-4 border-navy-800 text-center text-[10px] font-bold uppercase tracking-wider text-slate-400">Ground Entrance • ${b.block}</div>
                </div>
              </div>
            `;
          }).join('')}
        </div>

        <button data-go="preference" class="px-5 py-2.5 rounded-xl btn-soft text-xs sm:text-sm font-bold">← Back to Preference</button>
      </div>
    `;
  },

  occupancy() {
    const bld = getBuilding(STATE.buildingId);
    const flSpacesAll = accessibleSpaces(SPACES.filter(s => s.bld === bld.id && s.floor === STATE.floor));
    const flSpacesFiltered = flSpacesAll.filter(sp => {
      if (STATE.floorFilter === 'match') return spaceMatchesPreference(sp);
      if (STATE.floorFilter === 'vacant') return countVacant(sp) > 0;
      return true;
    });
    const displaySpaces = flSpacesFiltered.length ? flSpacesFiltered : flSpacesAll;
    if (!displaySpaces.some(s => s.id === STATE.activeSpaceId) && displaySpaces.length) {
      STATE.activeSpaceId = displaySpaces[0].id;
    }
    const activeSp = getSpace(STATE.activeSpaceId);

    const flTotal = sumBy(flSpacesAll, s => s.total);
    const flVacant = sumBy(flSpacesAll, countVacant);
    const flBooked = flTotal - flVacant;
    const matchCount = flSpacesAll.filter(spaceMatchesPreference).length;

    return `
      <div class="view-enter">
        ${renderStepper(4)}

        <div class="flex flex-wrap items-center justify-between gap-3 mb-4">
          <div class="flex flex-wrap items-center gap-2 text-xs font-bold">
            <button data-go="location" class="px-3 py-1.5 rounded-xl btn-soft">← All Buildings</button>
            <span class="text-slate-400">›</span>
            <span class="text-navy-800">${bld.name} (${bld.block})</span>
            <span class="text-slate-400">›</span>
            <span class="px-3 py-1 rounded-full bg-tealbrand-100 text-tealbrand-700">Floor ${STATE.floor} Interior</span>
          </div>

          <div class="flex items-center gap-1.5 bg-white p-1 rounded-xl border border-slate-200 shadow-sm">
            ${bld.floors.map(f => `
              <button data-act="enter-floor" data-bld="${bld.id}" data-fl="${f}" class="px-3.5 py-1.5 rounded-lg text-xs font-bold ${f === STATE.floor ? 'btn-navy' : 'text-slate-600 hover:bg-slate-100'}">Floor ${f}</button>
            `).join('')}
          </div>
        </div>

        ${demoNoticeBar(`<button data-act="refresh-demo" class="px-3.5 py-1.5 rounded-lg btn-teal text-[11px] font-bold">↻ Simulate Live Refresh</button>`)}

        <div class="grid grid-cols-2 lg:grid-cols-4 gap-3.5 mb-5">
          <div class="kpi-satin p-4 border-l-4 border-l-navy-800">
            <div class="text-xs font-semibold text-slate-500">Total Seats (Floor ${STATE.floor})</div>
            <div class="font-display text-2xl font-extrabold text-navy-800 mt-1">${flTotal}</div>
          </div>
          <div class="kpi-satin p-4 border-l-4 border-l-emerald-500">
            <div class="text-xs font-semibold text-slate-500">Vacant Seats</div>
            <div class="font-display text-2xl font-extrabold text-emerald-600 mt-1">${flVacant}</div>
          </div>
          <div class="kpi-satin p-4 border-l-4 border-l-rose-600">
            <div class="text-xs font-semibold text-slate-500">Booked Seats</div>
            <div class="font-display text-2xl font-extrabold text-rose-600 mt-1">${flBooked}</div>
          </div>
          <div class="kpi-satin p-4 border-l-4 border-l-tealbrand-500">
            <div class="text-xs font-semibold text-slate-500">Matching Spaces</div>
            <div class="font-display text-2xl font-extrabold text-tealbrand-600 mt-1">${matchCount} / ${flSpacesAll.length}</div>
          </div>
        </div>

        <div class="flex flex-wrap items-center justify-between gap-3 mb-4">
          <div class="flex flex-wrap gap-2">
            ${[
              ['all', 'All Spaces'],
              ['match', 'Matching Preference'],
              ['vacant', 'Vacant Only']
            ].map(([k, lbl]) => `
              <button data-act="set-floor-filter" data-val="${k}" class="px-3.5 py-1.5 rounded-full text-xs font-bold btn-chip ${STATE.floorFilter === k ? 'active' : ''}">${lbl}</button>
            `).join('')}
          </div>
          <div class="flex flex-wrap items-center gap-3 text-[11px] font-bold text-slate-600">
            <span class="flex items-center gap-1"><span class="w-2.5 h-2.5 rounded-full bg-emerald-500"></span>Vacant</span>
            <span class="flex items-center gap-1"><span class="w-2.5 h-2.5 rounded-full bg-rose-600"></span>Booked</span>
            <span class="flex items-center gap-1"><span class="w-2.5 h-2.5 rounded-full bg-blue-600"></span>Selected</span>
            <span class="flex items-center gap-1"><span class="w-2.5 h-2.5 rounded-full bg-amber-500"></span>Faculty / Expiring</span>
          </div>
        </div>

        <div class="flex flex-wrap gap-2.5 mb-5">
          ${displaySpaces.map(sp => {
            const active = sp.id === activeSp.id;
            return `
              <button data-act="select-space" data-sp="${sp.id}" class="px-4 py-2.5 rounded-xl border-2 text-left ${active ? 'btn-navy border-navy-800' : 'bg-white border-slate-200 text-navy-800 hover:border-tealbrand-500'}">
                <div class="flex items-center gap-2">
                  <span class="text-xs sm:text-sm font-bold">${sp.name}</span>
                  ${sp.audience === 'faculty' ? `<span class="px-1.5 py-0.5 rounded bg-amber-400 text-navy-950 text-[10px] font-extrabold">FACULTY</span>` : ''}
                </div>
                <div class="text-[11px] mt-0.5 ${active ? 'text-tealbrand-100' : 'text-slate-500'}">${sp.type === 'solo' ? 'Solo' : 'Group'} • ${sp.noise} • ${countVacant(sp)} vacant</div>
              </button>
            `;
          }).join('')}
        </div>

        <div class="glass-card p-5 sm:p-6">
          <div class="flex flex-wrap items-center justify-between gap-3 pb-4 border-b border-slate-100 mb-5">
            <div>
              <h2 class="font-display text-xl font-extrabold text-navy-800">${activeSp.name} — Desk & Chair Matrix</h2>
              <p class="text-xs text-slate-500 mt-0.5">${activeSp.desc}</p>
            </div>
            <div class="flex items-center gap-2 text-xs font-bold">
              <span class="px-3 py-1 rounded-full bg-emerald-50 text-emerald-700 border border-emerald-200">${countVacant(activeSp)} Vacant</span>
              <span class="px-3 py-1 rounded-full bg-rose-50 text-rose-700 border border-rose-200">${countBooked(activeSp)} Occupied</span>
            </div>
          </div>

          <div class="grid md:grid-cols-2 gap-5">
            ${[0, 1].map(tableIdx => {
              const half = Math.ceil(activeSp.chairs.length / 2);
              const slice = activeSp.chairs.slice(tableIdx * half, (tableIdx + 1) * half);
              if (!slice.length) return '';
              return `
                <div class="bg-slate-50/90 border border-slate-200/90 rounded-2xl p-4">
                  <div class="flex items-center justify-between mb-3">
                    <span class="text-[11px] font-extrabold uppercase tracking-wider text-slate-500">Study Table Zone ${tableIdx + 1}</span>
                    <span class="text-[11px] font-semibold text-tealbrand-700">${slice.filter(c => c.status === 'vacant').length} open</span>
                  </div>
                  <div class="grid grid-cols-4 gap-2.5">
                    ${slice.map(ch => {
                      const isSel = STATE.selectedChair && STATE.selectedChair.chairId === ch.id;
                      const visual = isSel ? 'selected' : ch.status;
                      const disabled = ch.status !== 'vacant' && !isSel;
                      return `
                        <button type="button" ${disabled ? 'disabled' : `data-act="pick-chair" data-sp="${activeSp.id}" data-ch="${ch.id}" data-code="${ch.code}"`} class="chair-tile ${visual}">
                          ${chairSvg(visual)}
                          <span class="text-[11px] font-bold leading-none">Seat ${ch.code}</span>
                        </button>
                      `;
                    }).join('')}
                  </div>
                </div>
              `;
            }).join('')}
          </div>

          <div class="mt-6 pt-5 border-t border-slate-200 flex flex-wrap items-center justify-between gap-4">
            <div class="text-xs sm:text-sm">
              ${STATE.selectedChair && STATE.selectedChair.spaceId === activeSp.id
                ? `<span class="text-slate-600">Selected:</span> <strong class="px-2.5 py-1 rounded-lg bg-blue-600 text-white ml-1">Seat ${STATE.selectedChair.code}</strong> <span class="text-slate-500 ml-1">in ${activeSp.name}</span>`
                : `<span class="text-slate-500">Click any <strong class="text-emerald-600">green vacant chair</strong> to pick your exact seat, then view full details.</span>`}
            </div>
            <button data-act="open-details" data-sp="${activeSp.id}" class="px-6 py-3 rounded-xl btn-navy text-xs sm:text-sm font-bold">
              View Space Details & Time Slots →
            </button>
          </div>
        </div>
      </div>
    `;
  },

  details() {
    const sp = getSpace(STATE.activeSpaceId);
    const bld = getBuilding(sp.bld);
    if (!STATE.selectedChair || STATE.selectedChair.spaceId !== sp.id) {
      const first = sp.chairs.find(c => c.status === 'vacant');
      if (first) STATE.selectedChair = { spaceId: sp.id, chairId: first.id, code: first.code };
    }

    return `
      <div class="view-enter max-w-5xl">
        ${renderStepper(5)}
        ${demoNoticeBar()}
        <div class="mb-6">
          <span class="text-xs font-bold uppercase tracking-wider text-tealbrand-600">Step 5 of 6 • Study-Space Details</span>
          <h1 class="font-display text-2xl sm:text-3xl font-extrabold text-navy-800 mt-1">${sp.name}</h1>
          <p class="text-sm text-slate-500 mt-1">${bld.name} (${bld.block}) • Floor ${sp.floor} • ${bld.hours}</p>
        </div>

        <div class="grid lg:grid-cols-12 gap-6 items-start">
          <div class="lg:col-span-7 space-y-5">
            <div class="glass-card p-5">
              <h2 class="font-display font-bold text-base text-navy-800 mb-2">Environment & Live Availability</h2>
              <p class="text-xs sm:text-sm text-slate-600 leading-relaxed mb-4">${sp.desc}</p>
              <div class="grid sm:grid-cols-2 gap-3 text-xs">
                <div class="p-3 rounded-xl bg-slate-50 border border-slate-200 flex justify-between"><span class="text-slate-500">Study Mode</span><strong class="text-navy-800">${sp.type === 'solo' ? 'Solo Study' : 'Group Study'}</strong></div>
                <div class="p-3 rounded-xl bg-slate-50 border border-slate-200 flex justify-between"><span class="text-slate-500">Noise Level</span><strong class="text-navy-800">${sp.noise}</strong></div>
                <div class="p-3 rounded-xl bg-emerald-50 border border-emerald-200 flex justify-between"><span class="text-emerald-700">Vacant Chairs</span><strong class="text-emerald-700">${countVacant(sp)} of ${sp.total}</strong></div>
                <div class="p-3 rounded-xl bg-rose-50 border border-rose-200 flex justify-between"><span class="text-rose-700">Booked Chairs</span><strong class="text-rose-700">${countBooked(sp)}</strong></div>
              </div>
            </div>

            <div class="glass-card p-5">
              <h2 class="font-display font-bold text-base text-navy-800 mb-3">Facilities Included</h2>
              <div class="grid grid-cols-2 sm:grid-cols-3 gap-2.5">
                ${sp.facilities.map(f => `
                  <div class="px-3 py-2.5 rounded-xl bg-slate-50 border border-slate-200 flex items-center gap-2 text-xs font-bold text-navy-800">
                    <span>${facilityIcon(f)}</span>
                    <span>${f}</span>
                  </div>
                `).join('')}
              </div>
            </div>

            <div class="glass-card p-5">
              <div class="flex items-center justify-between mb-3">
                <h2 class="font-display font-bold text-base text-navy-800">Mini Chair Preview</h2>
                <span class="text-xs font-bold text-tealbrand-700">Tap green chair to switch</span>
              </div>
              <div class="grid grid-cols-4 sm:grid-cols-6 gap-2">
                ${sp.chairs.map(ch => {
                  const isSel = STATE.selectedChair && STATE.selectedChair.chairId === ch.id;
                  const visual = isSel ? 'selected' : ch.status;
                  const disabled = ch.status !== 'vacant' && !isSel;
                  return `
                    <button type="button" ${disabled ? 'disabled' : `data-act="pick-chair" data-sp="${sp.id}" data-ch="${ch.id}" data-code="${ch.code}"`} class="chair-tile ${visual} !py-2">
                      <span class="text-[11px] font-bold">${ch.code}</span>
                    </button>
                  `;
                }).join('')}
              </div>
            </div>
          </div>

          <div class="lg:col-span-5 glass-card p-5 sticky top-20">
            <h2 class="font-display font-bold text-base text-navy-800 pb-3 border-b border-slate-100">Choose Your Time Slot</h2>
            <div class="my-4 p-3.5 rounded-xl bg-tealbrand-50 border border-tealbrand-500/30 flex items-center justify-between">
              <div>
                <div class="text-[10px] font-extrabold uppercase tracking-wider text-tealbrand-700">Chosen Seat</div>
                <div class="font-display text-2xl font-extrabold text-navy-800">${STATE.selectedChair ? 'Seat ' + STATE.selectedChair.code : 'No Vacant Seat'}</div>
              </div>
              <div class="text-right text-xs">
                <div class="font-bold text-navy-800">${getProfile().name}</div>
                <div class="text-slate-500">${getProfile().idNumber}</div>
              </div>
            </div>

            <div class="space-y-2 mb-5">
              ${TIME_SLOTS.map(sl => `
                <button data-act="set-slot" data-val="${sl}" class="w-full px-3.5 py-2.5 rounded-xl border text-left text-xs font-bold flex items-center justify-between ${STATE.timeSlot === sl ? 'btn-navy border-navy-800' : 'bg-white border-slate-200 text-slate-700 hover:border-tealbrand-500'}">
                  <span>🕒 ${sl}</span>
                  ${STATE.timeSlot === sl ? '<span>✓</span>' : ''}
                </button>
              `).join('')}
            </div>

            <button data-act="proceed-final" class="w-full py-3.5 rounded-xl btn-teal text-sm font-bold mb-3">
              Generate Digital Seat Pass →
            </button>
            <button data-go="occupancy" class="w-full py-2.5 rounded-xl btn-soft text-xs font-bold">
              ← Back to Chair Matrix
            </button>
          </div>
        </div>
      </div>
    `;
  },

  final() {
    const pass = STATE.lastPass || STATE.bookings[0];
    if (!pass) {
      return `
        <div class="view-enter max-w-xl mx-auto">
          ${renderStepper(6)}

              <button data-act="save-prefs" class="w-full py-2.5 rounded-xl btn-navy text-xs font-bold">Save Study Preferences</button>
            </div>
          </div>

          <div class="lg:col-span-7 space-y-5">
            <div class="grid sm:grid-cols-2 gap-4">
              <div class="kpi-satin p-5">
                <div class="text-xs font-semibold text-slate-500">Active Seat Bookings</div>
                <div class="font-display text-2xl font-extrabold text-navy-800 mt-1">${STATE.bookings.length}</div>
                <button data-go="location" class="text-xs font-bold text-tealbrand-700 mt-2 hover:underline">Book a new seat →</button>
              </div>
              <div class="kpi-satin p-5">
                <div class="text-xs font-semibold text-slate-500">Pending Library Dues</div>
                <div class="font-display text-2xl font-extrabold ${totalFines > 0 ? 'text-rose-600' : 'text-emerald-600'} mt-1">₹${totalFines} <span class="text-xs font-semibold text-slate-400">(${overdueCount} overdue)</span></div>
                <button data-go="books" class="text-xs font-bold text-tealbrand-700 mt-2 hover:underline">Open Books & Reminders →</button>
              </div>
            </div>

            <div class="glass-card p-6">
              <div class="flex items-center justify-between pb-4 border-b border-slate-100 mb-4">
                <div>
                  <h2 class="font-display font-bold text-lg text-navy-800">Active Seat Booking Passes</h2>
                  <p class="text-xs text-slate-500">Cancelling a booking immediately frees the chair back to green.</p>
                </div>
              </div>
              ${STATE.bookings.length ? `
                <div class="space-y-3">
                  ${STATE.bookings.map(bk => `
                    <div class="p-4 rounded-2xl bg-slate-50 border border-slate-200 flex flex-wrap items-center justify-between gap-3">
                      <div>
                        <div class="flex items-center gap-2">
                          <span class="px-2.5 py-0.5 rounded-lg btn-navy text-xs font-bold">Seat ${bk.chairCode}</span>
                          <span class="font-bold text-sm text-navy-800">${bk.spaceName}</span>
                        </div>
                        <div class="text-xs text-slate-600 mt-1">${bk.buildingName} (${bk.block}) • Floor ${bk.floor}</div>
                        <div class="text-[11px] text-slate-500 mt-0.5">🕒 ${bk.slot}</div>
                      </div>
                      <div class="flex items-center gap-2">
                        <button data-act="view-pass" data-id="${bk.bookingId}" class="px-3 py-1.5 rounded-lg btn-soft text-xs font-bold">QR Pass</button>
                        <button data-act="cancel-pass" data-id="${bk.bookingId}" class="px-3 py-1.5 rounded-lg bg-rose-50 border border-rose-200 text-rose-700 hover:bg-rose-100 text-xs font-bold">Cancel</button>
                      </div>
                    </div>
                  `).join('')}
                </div>
              ` : `
                <div class="text-center py-8">
                  <div class="text-3xl mb-2">🪑</div>
                  <div class="text-sm font-bold text-navy-800">No Active Seat Passes</div>
                  <p class="text-xs text-slate-500 mt-1 mb-4">Explore any building floor to reserve a vacant chair.</p>
                  <button data-go="preference" class="px-5 py-2.5 rounded-xl btn-teal text-xs font-bold">Find a Seat →</button>
                </div>
              `}
            </div>
          </div>
        </div>
      </div>
    `;
  },

  flow() {
    const nodes = [
      { n: 1, id: 'home', t: 'Home Page', d: 'Hero, 4 steps & FAQs' },
      { n: 2, id: 'preference', t: 'Study Preference', d: 'Role, Solo/Group & Noise' },
      { n: 3, id: 'location', t: 'Building & Floor', d: '4 LPU blocks & elevations' },
      { n: 4, id: 'occupancy', t: 'Chair Matrix', d: 'Floor interior green/red chairs' },
      { n: 5, id: 'details', t: 'Space Details', d: 'Facilities & time slots' },
      { n: 6, id: 'final', t: 'Final Seat Pass', d: 'QR pass, save & share' }
    ];
    const donePct = Math.round((STATE.completedTasks.length / CP5_TASKS.length) * 100);

    return `
      <div class="view-enter max-w-5xl">
        ${demoNoticeBar()}
        <div class="mb-6">
          <span class="text-xs font-bold uppercase tracking-wider text-tealbrand-600">INT335 Design Thinking • CP5 Deliverable</span>
          <h1 class="font-display text-2xl sm:text-3xl font-extrabold text-navy-800 mt-1">Interactive User Flow & Usability Testing</h1>
          <p class="text-sm text-slate-500 mt-1">Click any node in the flow diagram to open that screen, and track live usability test completion below.</p>
        </div>

        <div class="glass-card p-6 mb-6">
          <h2 class="font-display font-bold text-base text-navy-800 mb-4">Connected 6-Screen User Flow + Side Paths</h2>
          <div class="grid sm:grid-cols-2 lg:grid-cols-3 gap-4 mb-5">
            ${nodes.map(nd => `
              <button data-go="${nd.id}" class="glass-card glass-card-hover p-4 text-left flex items-start gap-3">
                <span class="w-8 h-8 rounded-full btn-navy font-display font-extrabold text-xs flex items-center justify-center shrink-0">${nd.n}</span>
                <div>
                  <div class="font-bold text-sm text-navy-800">${nd.t}</div>
                  <div class="text-xs text-slate-500 mt-0.5">${nd.d}</div>
                </div>
              </button>
            `).join('')}
          </div>

          <div class="pt-4 border-t border-slate-200 grid sm:grid-cols-2 gap-3">
            <button data-go="books" class="p-4 rounded-2xl bg-tealbrand-50/80 border border-tealbrand-500/30 hover:border-tealbrand-500 text-left flex items-center justify-between gap-3">
              <div>
                <div class="text-[10px] font-extrabold uppercase tracking-wider text-tealbrand-700">Side Path A</div>
                <div class="font-bold text-sm text-navy-800">Books, Fines & Smart Reminders</div>
              </div>
              <span class="font-bold text-tealbrand-700">→</span>
            </button>
            <button data-go="profile" class="p-4 rounded-2xl bg-navy-50 border border-slate-200 hover:border-navy-800 text-left flex items-center justify-between gap-3">
              <div>
                <div class="text-[10px] font-extrabold uppercase tracking-wider text-navy-800">Side Path B</div>
                <div class="font-bold text-sm text-navy-800">Digital Student / Faculty Profile & ID</div>
              </div>
              <span class="font-bold text-navy-800">→</span>
            </button>
          </div>
        </div>

        <div class="glass-card p-6">
          <div class="flex flex-wrap items-center justify-between gap-3 mb-3">
            <div>
              <h2 class="font-display font-bold text-lg text-navy-800">CP5 Usability Testing Checklist</h2>
              <p class="text-xs text-slate-500">Check off tasks as LPU students and teachers complete them during testing.</p>
            </div>
            <span class="px-3 py-1 rounded-full bg-tealbrand-100 text-tealbrand-700 text-xs font-extrabold">${STATE.completedTasks.length} / ${CP5_TASKS.length} Completed (${donePct}%)</span>
          </div>
          <div class="w-full h-2.5 bg-slate-100 rounded-full overflow-hidden mb-5">
            <div class="h-full bg-tealbrand-500 rounded-full transition-all duration-300" style="width:${donePct}%"></div>
          </div>
          <div class="space-y-2.5">
            ${CP5_TASKS.map((t, idx) => {
              const checked = STATE.completedTasks.includes(t.id);
              return `
                <button data-act="toggle-task" data-id="${t.id}" class="w-full p-4 rounded-xl border text-left flex items-start gap-3 ${checked ? 'bg-emerald-50/80 border-emerald-300' : 'bg-slate-50/90 border-slate-200 hover:border-tealbrand-500'}">
                  <span class="w-6 h-6 rounded-lg flex items-center justify-center text-xs font-extrabold shrink-0 mt-0.5 ${checked ? 'bg-emerald-500 text-white' : 'bg-white border border-slate-300 text-slate-400'}">${checked ? '✓' : idx + 1}</span>
                  <span class="text-xs sm:text-sm ${checked ? 'line-through text-emerald-900/70' : 'text-navy-800 font-medium'}">${t.text}</span>
                </button>
              `;
            }).join('')}
          </div>
        </div>
      </div>
    `;
  }
};

function renderModal() {
  const root = document.getElementById('modal-root');
  if (!STATE.paymentModalBookId) {
    root.innerHTML = '';
    return;
  }
  const book = STATE.books.find(b => b.id === STATE.paymentModalBookId);
  if (!book) {
    root.innerHTML = '';
    return;
  }
  const fine = getBookFine(book);
  root.innerHTML = `
    <div class="fixed inset-0 z-50 modal-backdrop flex items-center justify-center p-4">
      <div class="glass-card max-w-md w-full p-6 view-enter shadow-2xl">
        <div class="flex items-start justify-between gap-3 pb-3 border-b border-slate-100 mb-4">
          <div>
            <span class="text-[10px] font-extrabold uppercase tracking-wider text-tealbrand-600">LPU Demo Fine Settlement</span>
            <h3 class="font-display text-lg font-extrabold text-navy-800">Pay Overdue Library Fine</h3>
          </div>
          <button data-act="close-pay-modal" class="w-8 h-8 rounded-lg btn-soft text-sm font-bold">✕</button>
        </div>

        <div class="p-3.5 rounded-xl bg-rose-50 border border-rose-200 mb-4">
          <div class="text-xs font-bold text-navy-800">${book.title}</div>
          <div class="flex items-center justify-between mt-1.5 text-xs">
            <span class="text-rose-700">${Math.abs(book.dueOffset)} days overdue × ₹5/day</span>
            <strong class="font-display text-lg text-rose-700">₹${fine}</strong>
          </div>
        </div>

        <div class="text-xs font-bold text-slate-600 mb-2">Select Demo Payment Method</div>
        <div class="grid grid-cols-3 gap-2 mb-5">
          ${['UPI', 'Campus Wallet', 'Card'].map(m => `
            <button data-act="set-pay-method" data-val="${m}" class="py-2.5 px-2 rounded-xl text-xs font-bold border ${STATE.paymentMethod === m ? 'btn-navy border-navy-800' : 'bg-white border-slate-200 text-slate-700 hover:border-tealbrand-500'}">${m}</button>
          `).join('')}
        </div>

        <div class="flex gap-2.5">
          <button data-act="close-pay-modal" class="flex-1 py-2.5 rounded-xl btn-soft text-xs font-bold">Cancel</button>
          <button data-act="confirm-pay-fine" data-bk="${book.id}" class="flex-1 py-2.5 rounded-xl btn-teal text-xs font-bold">Pay ₹${fine} Now (Demo)</button>
        </div>
      </div>
    </div>
  `;
}

function renderApp(keepScroll = false) {
  const shell = document.getElementById('app-shell');
  const { desktopSidebar, mobileBottomNav } = renderSidebarAndMobileNav();

  if (STATE.screen === 'home') {
    shell.innerHTML = `${renderHeader()}<main class="flex-1">${VIEWS.home()}</main>`;
  } else {
    shell.innerHTML = `
      ${renderHeader()}
      <div class="flex-1 flex">
        ${desktopSidebar}
        <main class="flex-1 min-w-0 p-4 sm:p-6 lg:p-8 pb-24 lg:pb-10">
          ${VIEWS[STATE.screen]()}
        </main>
      </div>
      ${mobileBottomNav}
    `;
  }

  renderModal();
  if (!keepScroll) window.scrollTo({ top: 0, behavior: 'smooth' });
}

function copyText(text) {
  const ta = document.createElement('textarea');
  ta.value = text;
  ta.style.position = 'fixed';
  ta.style.opacity = '0';
  document.body.appendChild(ta);
  ta.select();
  try {
    document.execCommand('copy');
    showToast('Details Copied!', 'Ready to paste into WhatsApp or Teams.', 'green');
  } catch (err) {
    showToast('Copy Unavailable', 'Please copy the pass details manually.', 'amber');
  }
  ta.remove();
}

document.addEventListener('click', (e) => {
  const goEl = e.target.closest('[data-go]');
  if (goEl) {
    STATE.screen = goEl.dataset.go;
    renderApp(false);
    return;
  }

  const actEl = e.target.closest('[data-act]');
  if (!actEl || actEl.disabled) return;
  const act = actEl.dataset.act;

  if (act === 'set-role') {
    STATE.role = actEl.dataset.role;
    showToast(`Switched to ${getProfile().roleLabel}`, `Signed in as ${getProfile().name} (${getProfile().idNumber})`, 'teal');
    renderApp(true);
  }
  else if (act === 'toggle-faq') {
    const idx = Number(actEl.dataset.idx);
    STATE.openFaq = STATE.openFaq === idx ? -1 : idx;
    renderApp(true);
  }
  else if (act === 'set-mode') { STATE.mode = actEl.dataset.mode; renderApp(true); }
  else if (act === 'set-noise') { STATE.noise = actEl.dataset.val; renderApp(true); }
  else if (act === 'set-size') { STATE.groupSize = Number(actEl.dataset.val); renderApp(true); }
  else if (act === 'jump-bld') { STATE.buildingId = actEl.dataset.bld; STATE.screen = 'location'; renderApp(false); }
  else if (act === 'enter-floor') {
    STATE.buildingId = actEl.dataset.bld || STATE.buildingId;
    STATE.floor = Number(actEl.dataset.fl);
    STATE.floorFilter = 'all';
    const list = accessibleSpaces(SPACES.filter(s => s.bld === STATE.buildingId && s.floor === STATE.floor));
    if (list.length) STATE.activeSpaceId = list[0].id;
    STATE.selectedChair = null;
    STATE.screen = 'occupancy';
    renderApp(false);
  }
  else if (act === 'set-floor-filter') { STATE.floorFilter = actEl.dataset.val; renderApp(true); }
  else if (act === 'select-space') { STATE.activeSpaceId = actEl.dataset.sp; STATE.selectedChair = null; renderApp(true); }
  else if (act === 'pick-chair') {
    const { sp, ch, code } = actEl.dataset;
    STATE.selectedChair = (STATE.selectedChair && STATE.selectedChair.chairId === ch) ? null : { spaceId: sp, chairId: ch, code };
    renderApp(true);
  }
  else if (act === 'open-details') { STATE.activeSpaceId = actEl.dataset.sp; STATE.screen = 'details'; renderApp(false); }
  else if (act === 'set-slot') { STATE.timeSlot = actEl.dataset.val; renderApp(true); }
  else if (act === 'proceed-final') {
    const sp = getSpace(STATE.activeSpaceId);
    const bld = getBuilding(sp.bld);
    const prof = getProfile();
    const chair = STATE.selectedChair && STATE.selectedChair.spaceId === sp.id
      ? sp.chairs.find(c => c.id === STATE.selectedChair.chairId)
      : sp.chairs.find(c => c.status === 'vacant');
    if (!chair || chair.status !== 'vacant') {
      showToast('Select a Vacant Chair', 'Please pick a green vacant chair first.', 'amber');
      return;
    }
    STATE.lastPass = {
      bookingId: 'LPU-' + Math.floor(1000 + Math.random() * 9000),
      userName: prof.name,
      userId: prof.idNumber,
      buildingId: bld.id,
      buildingName: bld.name,
      block: bld.block,
      floor: sp.floor,
      spaceId: sp.id,
      spaceName: sp.name,
      chairId: chair.id,
      chairCode: chair.code,
      slot: STATE.timeSlot,
      date: fmtDate(TODAY),
      noise: sp.noise,
      facilities: sp.facilities
    };
    STATE.screen = 'final';
    renderApp(false);
  }
  else if (act === 'save-pass') {
    const pass = STATE.lastPass;
    if (!pass) return;
    const sp = getSpace(pass.spaceId);
    const ch = sp.chairs.find(c => c.id === pass.chairId);
    if (ch) ch.status = 'mine';
    if (!STATE.bookings.some(b => b.bookingId === pass.bookingId)) {
      STATE.bookings.unshift(pass);
    }
    STATE.selectedChair = null;
    showToast(`Seat ${pass.chairCode} Saved!`, `${pass.spaceName} added to your Profile & Reminders.`, 'green');
    renderApp(true);
  }
  else if (act === 'add-study-rem') {
    const pass = STATE.lastPass || STATE.bookings[0];
    if (!pass) return;
    STATE.customReminders.unshift({
      id: 'rem-' + Date.now(),
      title: `Study session at ${pass.spaceName} (Seat ${pass.chairCode}, ${pass.buildingName})`,
      category: 'Study Session',
      when: pass.slot,
      done: false
    });
    showToast('Study Reminder Added!', 'View it anytime under Books & Reminders.', 'teal');
    renderApp(true);
  }
  else if (act === 'copy-pass') {
    const pass = STATE.lastPass || STATE.bookings[0];
    if (!pass) return;
    copyText(`A Seat to Study (LPU Demo Pass)\nPass: ${pass.bookingId}\nSpace: ${pass.spaceName} — Seat ${pass.chairCode}\nLocation: ${pass.buildingName} (${pass.block}), Floor ${pass.floor}\nSlot: ${pass.slot}\nFacilities: ${pass.facilities.join(', ')}`);
  }
  else if (act === 'view-pass') {
    const found = STATE.bookings.find(b => b.bookingId === actEl.dataset.id);
    if (found) { STATE.lastPass = found; STATE.screen = 'final'; renderApp(false); }
  }
  else if (act === 'cancel-pass') {
    const id = actEl.dataset.id;
    const idx = STATE.bookings.findIndex(b => b.bookingId === id);
    if (idx >= 0) {
      const bk = STATE.bookings[idx];
      const sp = getSpace(bk.spaceId);
      const ch = sp.chairs.find(c => c.id === bk.chairId);
      if (ch) ch.status = 'vacant';
      STATE.bookings.splice(idx, 1);
      if (STATE.lastPass && STATE.lastPass.bookingId === id) STATE.lastPass = STATE.bookings[0] || null;
      showToast('Booking Cancelled', `Seat ${bk.chairCode} is now vacant and green again.`, 'amber');
      renderApp(true);
    }
  }
  else if (act === 'refresh-demo') {
    SPACES.forEach(sp => {
      sp.chairs.forEach(ch => {
        if (ch.status !== 'mine' && Math.random() < 0.16) {
          ch.status = ch.status === 'vacant' ? 'booked' : 'vacant';
        }
      });
    });
    STATE.lastRefreshed = fmtTimeNow();
    STATE.selectedChair = null;
    showToast('Demo Occupancy Refreshed', `Updated sample chair counts at ${STATE.lastRefreshed}.`, 'teal');
    renderApp(true);
  }
  else if (act === 'renew-book') {
    const bk = STATE.books.find(b => b.id === actEl.dataset.bk);
    if (bk) {
      bk.dueOffset = Math.max(bk.dueOffset, 0) + 7;
      showToast('Book Renewed (+7 Days)', `${bk.title} is now due ${fmtShortDate(addDays(bk.dueOffset))}.`, 'green');
      renderApp(true);
    }
  }
  else if (act === 'open-pay-modal') {
    STATE.paymentModalBookId = actEl.dataset.bk;
    renderModal();
  }
  else if (act === 'close-pay-modal') {
    STATE.paymentModalBookId = null;
    renderModal();
  }
  else if (act === 'set-pay-method') {
    STATE.paymentMethod = actEl.dataset.val;
    renderModal();
  }
  else if (act === 'confirm-pay-fine') {
    const bk = STATE.books.find(b => b.id === actEl.dataset.bk);
    if (bk) {
      const paidAmt = getBookFine(bk);
      bk.finePaid = true;
      STATE.paymentModalBookId = null;
      showToast(`Fine Paid (₹${paidAmt})`, `Settled via ${STATE.paymentMethod}. Renewal is now unlocked!`, 'green');
      renderApp(true);
    }
  }
  else if (act === 'quick-book-rem') {
    const bk = STATE.books.find(b => b.id === actEl.dataset.bk);
    if (bk) {
      STATE.customReminders.unshift({
        id: 'rem-' + Date.now(),
        title: `Return or renew "${bk.title}" (${bk.callNo})`,
        category: 'Book Due',
        when: `Due ${fmtShortDate(addDays(bk.dueOffset))}`,
        done: false
      });
      showToast('Book Reminder Set', `Added alert for ${bk.title}.`, 'teal');
      renderApp(true);
    }
  }
  else if (act === 'dismiss-rem') {
    const id = actEl.dataset.id;
    if (actEl.dataset.auto === 'true') {
      STATE.dismissedAutoIds.push(id);
    } else {
      const found = STATE.customReminders.find(r => r.id === id);
      if (found) found.done = true;
    }
    showToast('Reminder Marked Done', '', 'green');
    renderApp(true);
  }
  else if (act === 'toggle-channel') {
    const ch = actEl.dataset.ch;
    STATE.channels[ch] = !STATE.channels[ch];
    showToast(`${ch.toUpperCase()} Alerts ${STATE.channels[ch] ? 'Enabled' : 'Paused'}`, 'Demo preference updated.', 'teal');
    renderApp(true);
  }
  else if (act === 'select-cal-day') {
    STATE.selectedCalDay = Number(actEl.dataset.day);
    renderApp(true);
  }
  else if (act === 'save-prefs') {
    const p = PROFILES[STATE.role];
    const m = document.getElementById('pref-mode');
    const b = document.getElementById('pref-bld');
    const n = document.getElementById('pref-noise');
    if (m) { p.defaultMode = m.value; STATE.mode = m.value; }
    if (b) { p.defaultBuilding = b.value; STATE.buildingId = b.value; }
    if (n) { p.defaultNoise = n.value; STATE.noise = n.value; }
    showToast('Preferences Saved', `Defaults updated for ${p.name}.`, 'green');
  }
  else if (act === 'toggle-task') {
    const id = actEl.dataset.id;
    STATE.completedTasks = STATE.completedTasks.includes(id)
      ? STATE.completedTasks.filter(x => x !== id)
      : [...STATE.completedTasks, id];
    renderApp(true);
  }
});

document.addEventListener('submit', (e) => {
  if (e.target.id === 'add-reminder-form') {
    e.preventDefault();
    const title = document.getElementById('rem-title').value.trim();
    const cat = document.getElementById('rem-cat').value;
    const rawWhen = document.getElementById('rem-when').value;
    if (!title) return;
    const whenText = rawWhen ? new Date(rawWhen).toLocaleString('en-GB', { day: '2-digit', month: 'short', hour: '2-digit', minute: '2-digit' }) : fmtShortDate(TODAY);
    STATE.customReminders.unshift({ id: 'rem-' + Date.now(), title, category: cat, when: whenText, done: false });
    showToast('Custom Reminder Added', `${cat} • ${whenText}`, 'green');
    renderApp(true);
  }
  else if (e.target.id === 'quick-search-form') {
    e.preventDefault();
    const q = document.getElementById('quick-search-input').value.trim().toLowerCase();
    STATE.searchQuery = q;
    if (!q) return;
    const sp = accessibleSpaces(SPACES).find(s => s.name.toLowerCase().includes(q));
    if (sp) {
      STATE.buildingId = sp.bld;
      STATE.floor = sp.floor;
      STATE.activeSpaceId = sp.id;
      STATE.screen = 'details';
      showToast(`Opened ${sp.name}`, `${getBuilding(sp.bld).name}, Floor ${sp.floor}`, 'teal');
      renderApp(false);
      return;
    }
    const bk = STATE.books.find(b => b.title.toLowerCase().includes(q));
    if (bk) {
      STATE.screen = 'books';
      showToast(`Found Book`, bk.title, 'teal');
      renderApp(false);
      return;
    }
    showToast('No Exact Match', 'Try searching "Reading", "Pods", or "Algorithms".', 'amber');
  }
});

renderApp(true);
</script>
